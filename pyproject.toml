[project]
name = "pharmacy-management"
version = "0.1.0"
description = ""
authors = [
    {name = "slsforme",email = "27ofdecember@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
    "django (>=6.0.4,<7.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "django-filter (>=25.2,<26.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-debug-toolbar (>=6.3.0,<7.0.0)",
    "mawo-pymorphy3 (>=1.0.4,<2.0.0)",
    "deep-translator (>=1.11.4,<2.0.0)",
    "rstr (>=3.2.2,<4.0.0)",
    "django-unfold (>=0.92.0,<0.93.0)",
    "django-import-export (>=4.4.1,<5.0.0)",
    "django-admin-sortable2 (>=2.3.1,<3.0.0)",
    "django-modeltranslation (>=0.20.3,<0.21.0)",
    "django-simple-history (>=3.11.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest-django = "^4.12.0"
pytest-cov = "^7.1.0"
ruff = "^0.15.12"
ipython = "^9.13.0"
factory-boy = "^3.3.3"
faker = "^40.15.0"


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

extend-ignore = ["F403", "F405"]

